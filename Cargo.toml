[package]
name = "JAZZ80"
version = "0.4.4"
edition = "2024"
resolver = "3"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.34"

# Native only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = "0.3.23"

# Web only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.77"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1.7"
tracing-wasm = "0.2.1"
eframe = { version = "0.36.1", features = ["persistence", "default_fonts", "glow"] }
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.104", features = ["HtmlCanvasElement", "Window", "Document", "Element"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }

[dev-dependencies]
rstest = "0.26.1"
egui_kittest = "0.36.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
