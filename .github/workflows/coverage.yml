name: Update Coverage Badge

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: |
          if ! command -v cargo-llvm-cov &> /dev/null; then
            cargo install cargo-llvm-cov
          else
            echo "cargo-llvm-cov is already installed"
          fi

      - name: Run llvm-cov (JSON)
        run: |
          cargo llvm-cov clean
          cargo llvm-cov --ignore-filename-regex ".*ui.*" --json --output-path coverage.json

      - name: Parse coverage and update gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -e

          # Extract total branch coverage percentage
          COVERAGE=$(jq '.data[0].totals.lines.percent' coverage.json)

          # cap to 2 decimal places
          COVERAGE=$(printf "%.2f" "$COVERAGE")
          echo "Coverage: $COVERAGE"

          # Pick color based on coverage % (using awk instead of bc)
          COLOR=$(awk -v cov="$COVERAGE" 'BEGIN { if (cov > 80) print "green"; else if (cov > 50) print "yellow"; else print "red" }')

          # Create JSON for badge
          cat <<EOJ > badge.json
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${COVERAGE}%",
            "color": "$COLOR"
          }
          EOJ

          CONTENT=$(jq -Rs . badge.json)

          # Upload to Gist
          curl -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d @- \
            https://api.github.com/gists/49a8384882f617ed2ce5fb36bb2fa343 <<EOF
          {
            "files": {
              "coverage.json": {
                "content": $CONTENT
              }
            }
          }
          EOF
