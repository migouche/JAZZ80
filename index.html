<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Z80 Simulator</title>
    <link data-trunk rel="copy-dir" href="z80 files" />
    <link data-trunk rel="copy-dir" href="docs" />
    <style>
      html {
        /* Remove touch delay: */
        touch-action: manipulation;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #0d0d12;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
        margin-right: auto;
        margin-left: auto;
        width: 100%;
        height: 100%;
      }

      #loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #17171f 0%, #0d0d12 70%);
        z-index: 9999;
        transition: opacity 0.5s ease;
        /* subtle scanline texture */
        background-image: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.02) 0px,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 1px,
          transparent 3px
        ), radial-gradient(ellipse at center, #17171f 0%, #0d0d12 70%);
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* --- Pulsing logo --- */
      #loading img {
        width: 180px;
        height: auto;
        animation: pulse 2.2s ease-in-out infinite;
        /* soft cyan glow, tweak color to match the logo */
        filter: drop-shadow(0 0 18px rgba(88, 230, 255, 0.55));
      }
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 10px rgba(88, 230, 255, 0.35));
        }
        50% {
          transform: scale(1.06);
          filter: drop-shadow(0 0 28px rgba(88, 230, 255, 0.75));
        }
      }

      .spinner {
        margin-top: 32px;
        width: 42px;
        height: 42px;
        border: 3px solid rgba(88, 230, 255, 0.15);
        border-top-color: #58e6ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        box-shadow: 0 0 12px rgba(88, 230, 255, 0.25);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* --- Loading text --- */
      .loading-text {
        margin-top: 18px;
        font-family: "Courier New", ui-monospace, monospace;
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #58e6ff;
        opacity: 0.8;
        animation: blink 1.2s steps(2, start) infinite;
      }
      @keyframes blink {
        to { visibility: hidden; }
      }

      /* --- Girlfriend credit --- */
      .credit {
        position: absolute;
        bottom: 28px;
        font-family: ui-monospace, "Courier New", monospace;
        font-size: 13px;
        color: #8a8a99;
        letter-spacing: 0.5px;
      }
      .credit a {
        color: #ff7edb; /* retro magenta accent */
        text-decoration: none;
        border-bottom: 1px dotted rgba(255, 126, 219, 0.5);
        transition: color 0.2s ease, border-bottom-color 0.2s ease;
      }
      .credit a:hover {
        color: #ffb3ec;
        border-bottom-color: #ffb3ec;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <img src="docs/logo.svg" alt="Z80 Simulator">
      <div class="spinner"></div>
      <div class="loading-text">Initializing CPU&hellip;</div>
      <p class="credit">
        Logo designed by my wonderful girlfriend,
        <a href="https://example.com" target="_blank" rel="noopener">Gea Kristek</a>
      </p>
    </div>
    <!-- The wasm code will resize this canvas to cover the entire window -->
    <canvas id="z80-simulator-canvas"></canvas>
  </body>
</html>
