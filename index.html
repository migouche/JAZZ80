<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Just another Zilog Z80, an interactive Zilog Z80 CPU simulator, editor, and debugger written in Rust and WebAssembly. Run Z80 assembly directly in your browser.">
    <meta name="keywords" content="JAZZ80, Z80 simulator, Zilog Z80, CPU emulator, Rust, WebAssembly, URJC, Just Another Zilog Z80">
    <meta name="theme-color" content="#212227">
    <meta name="google-site-verification" content="qHgfu6uRBRiDruoG-so5YUZPpXkPxofsC650_LvyVqM" />
    <meta name="color-scheme" content="dark">
    <title>JAZZ80 — Z80 Simulator</title>
    <link rel="icon" href="docs/logo.svg" type="image/svg+xml">
    <link data-trunk rel="copy-dir" href="z80 files" />
    <link data-trunk rel="copy-dir" href="docs" />
    <style>
      html {
        touch-action: manipulation;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #0d0d12;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
        margin-right: auto;
        margin-left: auto;
        width: 100%;
        height: 100%;
      }

      #loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #17171f 0%, #0d0d12 70%);
        z-index: 9999;
        transition: opacity 0.5s ease;
        background-image: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.02) 0px,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 1px,
          transparent 3px
        ), radial-gradient(ellipse at center, #17171f 0%, #0d0d12 70%);
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #loading img {
        width: 180px;
        height: auto;
        animation: pulse 2.2s ease-in-out infinite;
        filter: drop-shadow(0 0 18px rgba(88, 230, 255, 0.55));
      }
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 10px rgba(88, 230, 255, 0.35));
        }
        50% {
          transform: scale(1.06);
          filter: drop-shadow(0 0 28px rgba(88, 230, 255, 0.75));
        }
      }

      .spinner {
        margin-top: 32px;
        width: 42px;
        height: 42px;
        border: 3px solid rgba(88, 230, 255, 0.15);
        border-top-color: #58e6ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        box-shadow: 0 0 12px rgba(88, 230, 255, 0.25);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        margin-top: 18px;
        font-family: "Courier New", ui-monospace, monospace;
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #58e6ff;
        opacity: 0.8;
        animation: blink 1.2s steps(2, start) infinite;
      }
      @keyframes blink {
        to { visibility: hidden; }
      }

      .credit {
        position: absolute;
        bottom: 28px;
        font-family: ui-monospace, "Courier New", monospace;
        font-size: 13px;
        color: #8a8a99;
        letter-spacing: 0.5px;
      }
      .credit a {
        color: #ff7edb; /* retro magenta accent */
        text-decoration: none;
        border-bottom: 1px dotted rgba(255, 126, 219, 0.5);
        transition: color 0.2s ease, border-bottom-color 0.2s ease;
      }
      .credit a:hover {
        color: #ffb3ec;
        border-bottom-color: #ffb3ec;
      }
      .error-text {
        margin-top: 18px;
        max-width: 34rem;
        padding: 0 1rem;
        font-family: ui-monospace, "Courier New", monospace;
        font-size: 13px;
        line-height: 1.6;
        text-align: center;
        color: #ff9a9a;
      }
      .error-text a { color: #58e6ff; }
    </style>
  </head>
  <body>
    <div id="loading">
      <img src="docs/logo.svg" alt="JAZZ80 logo">
      <div class="spinner"></div>
      <div class="loading-text">Initializing CPU&hellip;</div>
      <p class="credit">
        Logo designed by my wonderful girlfriend, Gea Kristek
      </p>
    </div>
    <!-- The wasm code will resize this canvas to cover the entire window -->
    <canvas id="z80-simulator-canvas"></canvas>
    <noscript>
      <style>
        #loading { display: none !important; }
        .no-js {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0d0d12;
          z-index: 10000;
        }
      </style>
      <div class="no-js">
        <p class="error-text">
          JAZZ80 needs JavaScript and WebAssembly to run. Please enable JavaScript and reload the page.
        </p>
      </div>
    </noscript>
    <script>
      (function () {
        var loading = document.getElementById("loading");
        var timer = setTimeout(function () {
          if (!loading || loading.classList.contains("hidden")) return;
          loading.innerHTML =
            '<p class="error-text">JAZZ80 could not start.<br>' +
            "Your browser may not support WebAssembly, or the download failed.<br>" +
            '<a href="">Reload the page</a></p>';
        }, 20000);

        if (loading && window.MutationObserver) {
          new MutationObserver(function () {
            if (loading.classList.contains("hidden")) clearTimeout(timer);
          }).observe(loading, { attributes: true, attributeFilter: ["class"] });
        }
      })();
    </script>
  </body>
</html>
