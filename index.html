<!DOCTYPE html>
<html>
  <head>
    <!--
      If you want to support custom "404" pages on GitHub Pages:
      https://github.com/rafgraph/spa-github-pages
    -->
    <meta charset="utf-8">
    <title>Z80 Simulator</title>
    <link data-trunk rel="copy-dir" href="z80 files" />
    <link data-trunk rel="copy-dir" href="docs" />
    <style>
      html {
        /* Remove touch delay: */
        touch-action: manipulation;
      }
      body {
        /* Light mode background color for what is not covered by the egui canvas,
           or where the egui canvas is translucent. */
        background: #909090; /* 202020 dark, 909090 light */
        margin: 0;
        padding: 0;
      }
      canvas {
        display: block;
        margin-right: auto;
        margin-left: auto;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #909090;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading img {
        width: 180px;
        height: auto;
      }
      .spinner {
        margin-top: 24px;
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: #723ac7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>


    
  </head>
  <body>
    <div id="loading">
      <img src="docs/logo.svg" alt="Z80 Simulator">
      <div class="spinner"></div>
    </div>
    <!-- The wasm code will resize this canvas to cover the entire window -->
    <canvas id="z80-simulator-canvas"></canvas>

  </body>
</html>
